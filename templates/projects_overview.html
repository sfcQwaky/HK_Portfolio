{% include 'header.html' %}

<div class="container temp-650">
    {% for project in temp_projects %}
    <div class="row py-4">
        <div class="col-4 ">
            <h5>Title: {{ project.title }}</h5>
        </div>
        <div class="col-6">
            <p>Short overview: {{ project.short_desc }}</p>
        </div>
        <div class="col-2">
            <a href="{{ url_for('single_project', project_id=project.id)}}" class="btn btn-primary">See more</a>
        </div>
    </div>
    {% endfor %}


</div>
{% include "footer.html" %}

></script>
